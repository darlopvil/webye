<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <title>{{ if .Titulo }}{{ .Titulo }} · {{ end }}webye</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/estilo.css">
</head>
<body>
    <header class="cabecera">
        <div class="cabecera-interior">
            <a class="marca" href="/">we<span>bye</span></a>
            {{ if not .Inicio }}
            <form class="buscador" action="/search/" method="get" role="search">
                <input type="search" name="stext" value="{{ .Consulta }}" placeholder="Buscar en CeX" aria-label="Buscar en CeX" required>
                <button type="submit">Buscar</button>
            </form>
            {{ end }}
        </div>
    </header>

    <main class="contenido">
        {{ template "contenido" . }}
    </main>

    <footer class="pie">
        <p>
            <a href="https://github.com/darlopvil/webye">Código fuente</a>
            · AGPL-3.0
        </p>
        <p class="tenue">Instancia de uso privado. Proyecto independiente, sin relación con CeX.</p>
    </footer>
</body>
</html>
