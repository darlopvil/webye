# Example deployment. Copy to docker-compose.yml and adapt it.
#
# The service publishes no ports: it assumes a reverse proxy that reaches it
# by container name. The proxy network cannot be "internal", because the
# container needs outbound access to CeX.

services:
  webye_app:
    build: .
    image: webye:local
    container_name: webye_app
    restart: unless-stopped
    env_file: .env
    environment:
      GOMEMLIMIT: 32MiB
    mem_limit: 64m
    # webye writes nothing to disk.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # ports:
    #   - "127.0.0.1:8080:8080"
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true
